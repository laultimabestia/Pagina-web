<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Puntos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 30px; padding: 20px 30px 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1e3c72; }
        input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 50px; border: 2px solid #ccc; font-size: 1.2rem; box-sizing: border-box; }
        button { background: #1e3c72; color: white; font-weight: bold; cursor: pointer; border: none; }
        .puntos { font-size: 3rem; font-weight: bold; color: #0066cc; text-align: center; background: #e6f0ff; border-radius: 40px; padding: 10px; margin: 15px 0; }
        .error { color: #c0392b; background: #fce4e4; padding: 12px; border-radius: 30px; text-align: center; }
        .premio { background: #f8f9fc; margin: 5px 0; padding: 8px; border-radius: 20px; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎓 Consulta de Puntos</h1>
    <input type="text" id="rut" placeholder="Run (solo números)" autocomplete="off">
    <button id="btnConsultar">Consultar</button>
    <div id="resultado"></div>
    <p style="font-size:0.8rem; text-align:center;">Datos actualizados al instante</p>
</div>
<script>
    // URL de tu Apps Script (la que funciona con Python)
    const API_URL = "https://script.google.com/macros/s/AKfycbx2Ay6Ou93Sy0voVzkTDRPwY6lnz3SCXzHtJB3qqsW_xjHVoK8cgbYo4eXnL5yxwCR5rw/exec";

    document.getElementById("btnConsultar").onclick = async () => {
        let rut = document.getElementById("rut").value.trim().replace(/\D/g, "");
        if (!rut) { alert("Ingresa un número de Run válido"); return; }
        const div = document.getElementById("resultado");
        div.innerHTML = "<div>⏳ Consultando...</div>";
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ comando: "consultar", rut: rut })
            });
            const data = await response.json();
            if (data.status !== "ok") {
                div.innerHTML = "<div class='error'>❌ " + (data.message || "Error inesperado") + "</div>";
                return;
            }
            let html = `<div><strong>👤 ${data.nombre}</strong><br>📚 ${data.curso}</div>`;
            html += `<div class="puntos">🏆 ${data.puntos} PUNTOS</div>`;
            html += "<h3>🎁 Premios que puedes canjear ahora:</h3>";
            if (data.premios_disponibles && data.premios_disponibles.length) {
                data.premios_disponibles.forEach(p => html += `<div class="premio">✓ ${p}</div>`);
            } else {
                html += "<div class='premio'>✗ Ninguno por ahora</div>";
            }
            if (data.proximo_premio) {
                html += `<h4>🎯 Próximo premio:</h4><div class="premio"><strong>${data.proximo_premio}</strong> (faltan ${data.puntos_faltantes} pts)</div><p>⏳ Sigue acumulando puntos</p>`;
            } else {
                html += "<p style='color:green;'>🎉 ¡FELICITACIONES! Ya puedes canjear todos los premios</p>";
            }
            if (data.todos_los_premios && data.todos_los_premios.length) {
                html += "<hr><h4>🏅 Todos los premios a los que puedes aspirar:</h4>";
                data.todos_los_premios.forEach(prem => html += `<div class="premio">• ${prem.nombre} → ${prem.costo} pts</div>`);
            }
            div.innerHTML = html;
        } catch (err) {
            div.innerHTML = `<div class='error'>❌ Error de conexión: ${err.message}</div>`;
        }
    };
</script>
</body>
</html>
